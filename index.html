<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>單字練習室｜7000 Vocabulary</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#183c37;background:#f3f6ef}*{box-sizing:border-box}body{margin:0}header{max-width:1020px;margin:auto;padding:32px 24px;display:flex;justify-content:space-between;align-items:center}header b{letter-spacing:2px}header span,.muted{color:#68817b;font-size:14px}main{max-width:1020px;margin:auto;padding:20px 24px 60px}.eyebrow{color:#317a68;font-size:13px;letter-spacing:3px}h1{font-size:clamp(32px,5vw,48px);margin:10px 0}p{line-height:1.7}.layout{display:grid;grid-template-columns:280px 1fr;gap:24px;margin-top:30px}.panel{background:white;border:1px solid #dce5da;border-radius:22px;padding:25px;box-shadow:0 8px 30px #234c3410}label{display:block;font-size:13px;font-weight:650;margin:18px 0 8px}select,input{width:100%;padding:12px;background:#f9fbf7;border:1px solid #d7e2d4;border-radius:10px;color:inherit;font:inherit}button{font:inherit;cursor:pointer;border-radius:11px;border:1px solid #d7e2d4;background:white;padding:12px 16px;color:inherit}button:hover{background:#edf5eb}button:focus-visible{outline:3px solid #cf993e}button:disabled{cursor:default;opacity:.65}.primary{background:#226954;color:white;border-color:#226954}.primary:hover{background:#194f40}.wide{width:100%;margin-top:18px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{background:#eaf2e7;padding:8px 12px;border-radius:8px;font-size:13px}progress{width:100%;height:7px;accent-color:#30765d}#prompt{font-size:clamp(24px,4vw,36px);overflow-wrap:anywhere;margin:32px 0 8px}#ipa{color:#71847c;margin-bottom:26px}.choices{display:grid;gap:12px}.choice{text-align:left;line-height:1.6;display:block;width:100%}.correct{background:#e1f4e4!important;border-color:#3f9564}.wrong{background:#fff0ec!important;border-color:#c96a54}#feedback{line-height:1.8;min-height:36px;margin:18px 0}#next{float:right}#question{min-height:470px}nav{display:flex;gap:8px;margin-top:24px}nav button.active{background:#226954;color:white}#rootCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}.root{background:white;border:1px solid #dce5da;border-radius:16px;padding:22px}.root b{font-size:24px}.root p{margin-bottom:0}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#fff4d9;font-size:13px}footer{margin-top:25px;font-size:12px;color:#71847c}#storageNote{color:#9b4d29}#summary{font-size:18px;line-height:1.8}@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{padding:20px}header{padding:24px}header span{display:none}main{padding-top:0}.layout{gap:16px}#question{min-height:380px}}
</style></head><body><header><b>VOCAB / 單字練習室</b><span>每天進步一點，讓單字留下來。</span></header><main><div class="eyebrow">7000 VOCABULARY PRACTICE</div><h1>把不熟的字，練到熟。</h1><p class="muted">分級測驗、即時訂正，再把錯題練一遍。新增 L6 高頻必會精選 200，可整份測驗或分成 10 組練習。</p><nav><button id="quizTab" class="active">單字測驗</button><button id="rootsTab">L6 字根記憶</button></nav><section id="quizView" class="layout"><aside class="panel"><b>這次怎麼練？</b><label for="level">練習範圍</label><select id="level"><option>載入中…</option></select><label for="mode">題型</label><select id="mode"><option value="E2C">英選中 · 四選一</option><option value="C2E">中選英 · 四選一</option><option value="SPELL">看中文 · 拼英文</option></select><label for="count">題數</label><select id="count"><option>10</option><option>20</option><option>50</option><option selected>100</option><option>200</option><option value="all">全部</option></select><label><input id="auto" type="checkbox" checked style="width:auto"> 測驗後直接反覆複習錯題</label><button id="start" class="primary wide" disabled>載入中…</button><button id="review" class="wide" disabled>錯題本（0）</button><div id="poolInfo" class="muted" style="margin-top:16px"></div><p class="muted">錯題與成績保存在這台裝置、這個瀏覽器。</p><p id="storageNote" role="status"></p></aside><article id="question" class="panel"><div class="eyebrow" id="stage">READY TO PRACTICE</div><div class="stats"><span class="stat" id="progressText">尚未開始</span><span class="stat" id="score">答對 0 · 答錯 0</span></div><progress id="progress" max="100" value="0"></progress><h2 id="prompt">準備好，開始練習。</h2><div id="ipa"></div><div id="choices" class="choices"></div><form id="spellForm" class="hidden"><label for="spelling">輸入英文單字</label><input id="spelling" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="primary wide">檢查答案</button></form><div id="feedback" role="status" aria-live="polite"></div><div id="summary"></div><button id="reveal" class="hidden">不會，顯示答案</button><button id="next" class="primary hidden">下一題 →</button></article></section><section id="rootsView" class="hidden"><p>取自你上傳的 L6 字源整理，先熟悉這 15 組。字根是記憶線索，仍要搭配整個單字的意思。</p><div id="rootCards"></div></section><footer id="history"></footer></main><script src="app.js?v=high200"></script></body></html>
